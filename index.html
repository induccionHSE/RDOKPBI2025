    <style>

        :root {
            /* COLORES CORPORATIVOS */
            --primary: #003366;      /* Azul Oscuro Institucional */
            --secondary: #00509d;    /* Azul Medio */
            --accent: #f59d2c;       /* Dorado/Amarillo Seguridad */

            --text-light: #f8fafc;
            --bg-body: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SCROLLBAR PERSONALIZADO --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- SIDEBAR DE NAVEGACIÓN --- */
        .sidebar {
            width: 320px;
            background: var(--primary);
            color: white;
            display: flex; flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo-area {
            padding: 30px 20px;
            background: rgba(0,0,0,0.1);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        .nav-menu {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            font-size: 14px;
            display: flex; align-items: center; gap: 10px;
            color: rgba(255,255,255,0.7);
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; padding-left: 30px; }
        .nav-item.active {
            background: rgba(0,0,0,0.2);
            border-left-color: var(--accent);
            color: white;
            font-weight: 700;
        }
        .nav-icon { width: 24px; text-align: center; }

        /* Estilos del Footer de la barra lateral actualizado */
        .footer-info {
            padding: 20px;
            font-size: 11px;
            text-align: center;
            opacity: 0.9;
            border-top: 1px solid rgba(255,255,255,0.1);
            line-height: 1.5;
            background: rgba(0,0,0,0.1); /* Fondo sutil para destacar el bloque */
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }

        /* Encabezado de Página */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;
        }
        .doc-title h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--primary); letter-spacing: 1px; margin-bottom: 5px; }
        .doc-title span { font-family: 'Roboto', sans-serif; font-size: 14px; color: #64748b; font-weight: 500; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .status-pill {
            background: #dcfce7; color: #166534;
            padding: 8px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 700;
            border: 1px solid #bbf7d0; display: flex; align-items: center; gap: 6px;
        }

        .btn-pdf {
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-pdf:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(239, 68, 68, 0.4); }

        /* Estilos de Tarjetas y Grid */
        .section-view { display: none; animation: fadeIn 0.4s ease; }
        .section-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-container { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; margin-bottom: 20px; }
        .col-3 { grid-column: span 3; }
        .col-4 { grid-column: span 4; }
        .col-5 { grid-column: span 5; }
        .col-6 { grid-column: span 6; }
        .col-7 { grid-column: span 7; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .card {
            background: white; border-radius: 8px; padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0; height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 12px; font-weight: 800; text-transform: uppercase; color: #64748b;
            margin-bottom: 15px; letter-spacing: 0.5px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;
        }

        /* Tablas */
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { text-align: left; padding: 12px 10px; background: #f8fafc; color: #475569; border-bottom: 2px solid #e2e8f0; font-weight: 600; }
        .data-table td { padding: 10px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: middle; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background-color: #f8fafc; }

        /* Etiquetas de Estado */
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; display: inline-block; }
        .tag-ok { background: #dcfce7; color: #166534; }
        .tag-warn { background: #fef9c3; color: #854d0e; }
        .tag-err { background: #fee2e2; color: #991b1b; }
        .tag-info { background: #e0f2fe; color: #075985; }

        /* Elementos Específicos */
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-weight: 600; color: #475569; }
        
        .kpi-box { text-align: center; padding: 10px; }
        .kpi-val { font-size: 36px; font-weight: 900; color: var(--primary); line-height: 1; margin: 5px 0; }
        .kpi-sub { font-size: 11px; color: #64748b; font-weight: 500; text-transform: uppercase; }

        .dofa-item { padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 12px; }
        .dofa-green { background: #f0fdf4; border-left: 3px solid var(--success); }
        .dofa-red { background: #fef2f2; border-left: 3px solid var(--danger); }

        /* Firmas */
        .signature-box { margin-top: 40px; display: flex; justify-content: center; gap: 60px; }
        .sign-line { border-top: 1px solid #334155; width: 220px; padding-top: 10px; text-align: center; font-size: 12px; font-weight: bold; }

        /* =========================================
           DISEÑO RESPONSIVO (MÓVIL)
           ========================================= */
        @media (max-width: 768px) {

            .sidebar { width: 100%; height: auto; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
            
            .nav-menu {
                display: flex; overflow-x: auto; padding: 10px;

            }
            
            .nav-item {
                padding: 10px 15px; border-left: none; border-bottom: 3px solid transparent;

            .nav-item:hover { padding-left: 15px; } /* Reset hover effect on mobile */
            .nav-item.active { background: rgba(0,0,0,0.2); border-left-color: transparent; border-bottom-color: var(--accent); }
            
            .footer-info { display: none; }
            .logo-area { padding: 15px; }
            .logo-img { max-width: 120px; }
            
            .main { padding: 15px; width: 100%; overflow: visible; }
            
            .page-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-actions { width: 100%; flex-wrap: wrap; }
            .doc-title h1 { font-size: 28px; }
            
            .grid-container { display: flex; flex-direction: column; gap: 15px; }
            [class*="col-"] { width: 100%; grid-column: span 12 !important; }
            
            .card { padding: 15px; overflow-x: auto; }
            .data-table { min-width: 600px; }
            
            .signature-box { flex-direction: column; gap: 40px; align-items: center; }
            canvas { max-height: 200px; }
        }
    
        /* ====== COMPONENTES DEL RENDERIZADOR ====== */
        .stack .card { height: auto; margin-bottom: 20px; }
        .stack .card:hover { transform: none; }
        .para { font-size: 13px; line-height: 1.65; margin: 8px 0; color: #334155; }
        .para.ref { font-size: 12px; color: #64748b; font-style: italic; }
        .lbl { font-size: 13px; font-weight: 700; color: var(--primary); margin: 20px 0 8px 0; }
        .ul-clean { margin: 8px 0 8px 22px; font-size: 13px; line-height: 1.6; color: #334155; }
        .ul-clean li { margin-bottom: 4px; }
        .table-wrap { overflow-x: auto; margin: 10px 0 16px 0; }
        .data-table td, .data-table th { vertical-align: top; }
        .data-table td strong { color: #1e293b; }
        .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 30px; margin: 8px 0 14px 0; }
        .kv { font-size: 13px; border-bottom: 1px dashed #e2e8f0; padding: 6px 0; line-height: 1.5; }
        .kv.wide { grid-column: span 2; }
        .kv .k { display: block; font-weight: 600; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 10px 0 14px 0; }
        .kpi-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; text-align: center; }
        .kpi-card .kpi-val { font-size: 26px; margin: 4px 0; }
        .kpi-card .kpi-lab { font-size: 11px; color: #475569; font-weight: 600; line-height: 1.3; }
        .kpi-card .kpi-sub { margin-top: 6px; text-transform: none; }
        .chart-box { position: relative; height: 190px; max-width: 420px; margin: 10px auto 16px auto; }
        .pend { background: #fde047; color: #422006; padding: 1px 5px; border-radius: 3px; font-weight: 600; font-size: 11px; }
        .note-box { font-size: 12px; background: #fefce8; border: 1px solid #fde047; color: #713f12; padding: 10px 12px; border-radius: 6px; margin-bottom: 15px; line-height: 1.5; }
        .sign-line span { display: block; font-weight: 400; color: #64748b; margin-top: 2px; }
        .sign-meta { display: flex; justify-content: center; gap: 60px; margin-top: 24px; font-size: 12px; color: #475569; text-align: center; line-height: 1.6; }
        .loading { padding: 40px; color: #64748b; font-size: 14px; }
        @media print {
            body { display: block; height: auto; overflow: visible; }
            .sidebar, .btn-pdf { display: none !important; }
            .main { overflow: visible; padding: 0; }
            .section-view { display: block !important; page-break-after: always; }
            .card { box-shadow: none; break-inside: avoid; }
        }

    </style>

<script id="acta-data" type="application/json">{"meta":{"title":"ACTA REVISIÓN GERENCIAL","code":"FOR-GER-02","version":"06","date":"26/01/2026"},"blocks":[{"t":"h1","n":"1","text":"INFORMACIÓN GENERAL"},{"t":"table","rows":[["**Fecha:**","30/01/2026","**Hora:**","8:00 am – 10:00 am"],["**Lugar:**","Sala de Juntas Administración Bogotá","**Ciudad:**","Bogotá D.C."],["**Periodo Evaluado :**","Enero 2025 – Diciembre 2025"],["**Asistentes:**","1. Luis Eduardo Henriquez (Gerente General)\n2. Carlos Esteban (Director HSEQ)\n3. Holman Moreno (Coordinador HSEQ)"],["**Propósito:**","Verificar la conveniencia, adecuación, eficacia y alineación estratégica del Sistema Integrado de Gestión (ISO 9001, ISO 14001, ISO 45001, Dec. 1072, PESV)."]]},{"t":"h1","n":"2","text":"SEGUIMIENTO A COMPROMISOS PREVIOS (Revisión anterior)"},{"t":"p","text":"~~Referencia: Numeral 9.3 (c) ISO 9001/14001/45001.~~","i":true},{"t":"p","text":"Se verifica el estado de las acciones definidas en la revisión gerencial del año 2024 :","i":false},{"t":"table","rows":[["**Compromiso / Actividad (2024)**","**Responsable**","**Estado Actual (2025)**","**Eficacia**","**Observaciones / Gestión del Cambio**"],["**1. Certificación ISO 50001** (Diagnóstico)","Dir. HSEQ","**En proceso**","Pendiente","Se cuenta con cotizaciones de varios proveedores para dar cierre al diagnostico."],["**2. Incorporar proceso financiero al SIG**","Dir. HSEQ","**En Proceso**","Pendiente","Se continúa trabajando en la alineación de procedimientos."],["**3. Software ISOLUCION**","Dir. HSEQ","**Ejecutado (con Cambio)**","**SÍ**","**Gestión del Cambio:** Se desestimó ISOLUCION. Se implementó automatización interna mediante **Appscript y Google**, optimizando costos y adaptabilidad."],["**4. Actualización Documental**","Líderes","**En Proceso**","Parcial","Se mantiene como actividad permanente del SIG."],["**5. Cultura HSEQ** (Incentivar participación)","Dir. HSEQ","**En Proceso**","Parcial","Se requieren nuevas estrategias para 2026 (Ver Análisis de Participación)."],["**6. Dashboards/KPIs** (Mejorar visualización)","Área HSEQ","**Cerrado**","**SÍ**","Se cuenta con paneles de control que facilitan la toma de decisiones."]]},{"t":"h1","n":"3","text":"ENTRADAS ESTRATÉGICAS: PLANIFICACIÓN Y CONTEXTO"},{"t":"p","text":"~~Referencia: ISO 9001 (9.3.2 b), ISO 14001 (9.3 b), ISO 45001 (9.3 b).~~","i":true},{"t":"h2","n":"3.1","text":"Cambios en el Contexto (Cuestiones Internas y Externas)"},{"t":"p","text":"Se actualizó la Matriz DOFA con corte a Septiembre 2025. A continuación, los cambios más relevantes:","i":false},{"t":"li","text":"**Factores Externos (Oportunidades y Amenazas):**"},{"t":"li","text":"**Oportunidades:** Crecimiento en incentivos para **Transición Energética y ESG** (gas/solar) ; apertura de mercados regionales (Andina) y acceso a tecnologías de monitoreo remoto."},{"t":"li","text":"**Amenazas:** Alta volatilidad macroeconómica (TRM, inflación) ; riesgo recurrente de **bloqueos sociales** y conflictividad en zonas operativas ; declinación natural de pozos y nuevas exigencias regulatorias ambientales."},{"t":"li","text":"**Factores Internos (Fortalezas y Debilidades):**"},{"t":"li","text":"**Fortalezas:** Liderazgo en **Transformación Digital** (uso de IA y automatización en HSEQ) ; resiliencia operativa ante crisis y sistema de gestión maduro y certificado."},{"t":"li","text":"**Debilidades:** Restricciones de **flujo de caja** para inversiones ; dependencia operativa de pozos maduros sin plan de continuidad de negocio (BCP) documentado ; brechas en competencias digitales avanzadas y gestión documental."},{"t":"p","text":"**DECLARACIÓN SOBRE EL CAMBIO CLIMÁTICO (ISO Amendment 1:2024)** En cumplimiento con la modificación a las cláusulas 4.1 y 4.2 de las normas ISO, la Alta Dirección determina que el Cambio Climático **ES UNA CUESTIÓN PERTINENTE** para el Sistema de Gestión, abordada desde tres frentes:","i":false},{"t":"li","text":"**Riesgo Físico:** Vulnerabilidad de la infraestructura (pozos/plantas) ante eventos extremos (inundaciones en zonas como Sinú 9 o sequías que afecten captación de agua)."},{"t":"li","text":"**Riesgo de Transición:** Adaptación a nuevas regulaciones (Impuesto al Carbono, exigencias ANLA) y cambios en la demanda del mercado hacia energías limpias."},{"t":"li","text":"**Oportunidad Estratégica:** Se alinea con la oportunidad identificada en la DOFA sobre incentivos para la **Transición Energética** y eficiencia operativa."},{"t":"h2","n":"3.2","text":"Necesidades y Comunicaciones de las Partes Interesadas"},{"t":"p","text":"Se revisó la actualización del **Análisis de Materialidad (Enero 2025)**, donde se validaron con la Gerencia 26 asuntos relevantes bajo el enfoque ESG (Ambiental, Social y Gobernanza).","i":false},{"t":"p","text":"**A. Nuevos Asuntos Materiales (Prioridades 2025):** El contexto estratégico cambia para enfocar esfuerzos en:","i":false},{"t":"li","text":"**Dimensión Ambiental:** Transformación energética, descarbonización y economía circular."},{"t":"li","text":"**Dimensión Social:** Derechos humanos, bienestar laboral y relacionamiento ético con comunidades."},{"t":"li","text":"**Gobernanza:** Ciberseguridad, privacidad de la información y cumplimiento normativo (Compliance)."},{"t":"p","text":"**B. Conclusión sobre el Contexto:** El Sistema de Gestión debe adaptarse para responder a estos nuevos retos, especialmente en la **digitalización de procesos** (Ciberseguridad) y la gestión de **activos sostenibles** (Economía Circular).","i":false},{"t":"h2","n":"3.3","text":"Gestión de Riesgos y Oportunidades"},{"t":"li","text":"**Eficacia de Controles:** Los controles implementados funcionaron eficazmente durante el periodo; **no se materializaron riesgos corporativos críticos** (como soborno, paro armado o fallas tecnológicas masivas)."},{"t":"li","text":"**Riesgos gestionados 2025:** 78 riesgos en 10 procesos corporativos (Bajo 35, Moderado 23, Alto 16 y Extremo 4)."},{"t":"li","text":"**Riesgos extremos:** los controles de los 4 riesgos extremos (Social, HSEQ y Cadena de Suministro) fueron eficaces; no se materializaron eventos catastróficos ni paradas no programadas."},{"t":"li","text":"**Oportunidades capitalizadas:** transformación digital del proceso HSEQ (implementación de AppScript para control en campo) y gestión social preventiva."},{"t":"li","text":"**Gestión 2026:** Se mantendrá el enfoque preventivo, especialmente en la protección contra ciberataques y la gestión de la conflictividad social"},{"t":"h2","n":"3.4","text":"Grado de Cumplimiento de la Política y Objetivos del SIG"},{"t":"p","text":"~~Resumen del Tablero de Indicadores:~~","i":true},{"t":"p","text":"~~Evaluación de las metas asociadas a los objetivos integrales y análisis de desviaciones.~~","i":true},{"t":"table","rows":[["**Objetivo del SIG**","**Indicador Asociado**","**Meta**","**Resultado 2025**","**Estado**","**Observaciones / Análisis del Indicador**"],["**1. Competencia del Personal**","Ejecución Plan Capacitación",">90%","95%","CUMPLE","El Proceso GH cuenta con un Plan de Capacitación bianual para los años 2025-2026. Para lo programado en el año 2025, se ejecutó al 100% el Plan de Capacitación orientado a los temas de Gestión Humana (Direccionamiento Estratégico, Políticas Organizacionales, Manuales, RIT, Convivencia Laboral, entre otros) y las capacitaciones de roles con requisito legal y solicitado por los líderes de proceso al 90% (medición de hidrocarburos, actualizaciones normativas laborales) y lo aprobado por Política de Fomento de Educación Superior"],["**2. Prevención SST**","Frecuencia de Accidentes (IF)","< 1.0","**0,00**","**CUMPLE**","Se mantuvo en cero la accidentalidad, demostrando la eficacia de los controles preventivos."],["**3. Ambiental**","Cumplimiento Programas SGA","100%","100%","Cumple","Durante la vigencia 2025 se evidenció un desempeño satisfactorio en la implementación de los programas de gestión ambiental, reflejado en el cumplimiento de metas. Se realizaron ajustes técnicos y operativos en los programas más relevantes, con el fin de optimizar su eficiencia, alinearlos con la normativa vigente.\nAdicionalmente, se estructuró y proyectó un programa piloto para la medición de la huella de carbono, orientado a la cuantificación de emisiones de gases efecto invernadero (GEI) y a la definición de estrategias de mitigación. Este piloto será implementado durante la vigencia 2026, como parte del compromiso institucional con la gestión del cambio climático, la sostenibilidad y la mejora del desempeño ambiental."],["**4. Proveedores**","Evaluación de Proveedores",">90%","94,57%","Cumple","El resultado cumple con la meta establecida, se evidencia el cumplimiento a satisfacción de los proveedores que suministran Bienes y Servicio a la compañía."],["**5. Satisfacción Cliente**","Índice de Satisfacción",">85%","**86%**","**CUMPLE**","**Desempeño Satisfactorio.** El resultado consolidado (4.3/5.0) supera la meta definida para el periodo, evidenciando altos niveles de fidelización y confianza en el servicio"],["**6. Legal**","Cumplimiento Matriz Legal","100%","**97,73%**","**NO CUMPLE**","No se presentaron multas ni sanciones. Se evaluaron los nuevos requisitos de 2025. Brecha de 2,27% por la formalización administrativa del Teletrabajo (ver 5.1 y decisión en 6.1)."],["**7. Gestión de Peligros**","Ejecución Inspecciones / Controles","95%","**99%**","**CUMPLE**","Ejecución global del 99% del cronograma de inspecciones (ver 4.4.B), por encima de la meta del 95%."],["**8. Mejora Continua**","Cierre de Acciones de Mejora","≥85%","**85%**","**CUMPLE**","Observación: Quedaron acciones abiertas a cierre de año por tiempos de ejecución. Se reprograman para Enero de 2026. Nota: este indicador corresponde al tablero de acciones de mejora; el consolidado de todas las fuentes de hallazgo (inspecciones, simulacros, tarjetas, auditorías y compromisos) se presenta en 5.3.B."],["**9. Riesgos Corporativos**","Eficacia Controles de Riesgo","100%","**100%**","**CUMPLE**","Los controles evitaron la materialización de riesgos críticos DOFA."]]},{"t":"h2","n":"3.5","text":"Adecuación y Suficiencia de Recursos 2025"},{"t":"p","text":"~~Referencia: ISO 9001 (9.3.2 d), ISO 14001 (9.3 e), ISO 45001 (9.3 e), Dec. 1072 (Art. 2.2.4.6.31, num. 3).~~","i":true},{"t":"table","rows":[["**Recurso / Programa**","**Evidencia del periodo**","**Conclusión**"],["**Mediciones higiénicas**","Realizadas en Buenavista y Sinú 9; no ejecutadas en Corrales, La Paz y EVECA por requerir priorización presupuestal (4.4.B).","Insuficiente en 2025; aprobado para febrero de 2026 (6.1)."],["**Dotación y certificación de alturas (Corrales); lavaojos (La Paz)**","Hallazgos críticos o abiertos a cierre de 2025 (4.4.B).","Insuficiente en 2025; aprobado para Q1 de 2026 (6.1)."],["**Infraestructura y tecnología**","Renovación de equipos de cómputo y software obsoleto (6.2).","Pendiente de decisión (6.2)."],["**Demás programas HSEQ**","Ejecutados con los recursos asignados; objetivos 1, 2, 3, 4, 5 y 9 cumplidos (3.4).","Suficiente."],["**Conclusión (propuesta)**","Los recursos 2025 fueron parcialmente suficientes; las brechas se concentran en los puntos anteriores.","[COMPLETAR: confirmación de la Gerencia]"]]},{"t":"h1","n":"4","text":"ENTRADAS OPERACIONALES: DESEMPEÑO DE LOS PROCESOS"},{"t":"p","text":"~~Referencia: ISO 9001 (9.3.2 c), ISO 14001 (9.3 d), Dec. 1072 (Art 2.2.4.6.31).~~","i":true},{"t":"h2","n":"4.1","text":"Desempeño Comercial y Satisfacción del Cliente (ISO 9001:2015)"},{"t":"p","text":"~~Resultados basados en encuestas (Omega, Kronos, Infraes, Vitol) y cumplimiento contractual.~~","i":true},{"t":"h3","text":"A. Indicadores Cuantitativos (Encuesta 2025):"},{"t":"p","text":"Se consolidaron las evaluaciones de servicio realizadas a los clientes activos durante el periodo.","i":false},{"t":"table","rows":[["**Indicador Clave**","**Meta**","**Resultado 2025**","**Análisis del Desempeño**"],["**Satisfacción Global**","> 4.0","**4.3 / 5.0**","**SOBRESALIENTE.** Se destaca la confiabilidad técnica y la disposición del personal."],["**Amabilidad y Servicio**","> 4.0","**4.4 / 5.0**","El trato del personal en campo es una fortaleza reconocida por el cliente."],["**HSEQ Percibido**","100%","**100%**","Los clientes validan el cumplimiento total de estándares de seguridad (0 Accidentes)."]]},{"t":"h3","text":"B. Análisis Cualitativo (Voz del Cliente):"},{"t":"li","text":"**Fortalezas:** Los clientes valoran la capacidad de respuesta, la seguridad operativa y el cumplimiento de estándares técnicos."},{"t":"li","text":"**Oportunidad de Mejora (INFRAES):** El cliente manifestó la necesidad de migrar hacia un esquema de **Mantenimiento Predictivo** y mejorar la gestión de inventarios (repuestos) para evitar reactividad."},{"t":"h3","text":"C. Gestión de PQRS (Peticiones, Quejas, Reclamos y Sugerencias):"},{"t":"li","text":"**Quejas Graves:** 0."},{"t":"li","text":"**Reclamos:** 0."},{"t":"li","text":"**Conclusión:** No se presentaron reclamaciones formales que afectaran la continuidad del negocio o la imagen reputacional."},{"t":"h3","text":"D. Conformidad del Servicio y Salidas No Conformes:"},{"t":"p","text":"~~Referencia: ISO 9001 (8.7 Control de salidas no conformes).~~","i":true},{"t":"p","text":"Se revisaron los reportes operativos y bitácoras para identificar servicios no conformes durante 2025.","i":false},{"t":"table","rows":[["**Tipo de Salida No Conforme**","**Cantidad**","**Tratamiento Aplicado**","**Análisis**"],["**SNC Críticas (Rechazos)**","**0**","N/A","No se presentaron eventos que implicarán la suspensión del contrato o glosas en la facturación."],["**SNC Menores (Desviaciones)**","**Bajo**","Corrección Inmediata","Se detectaron desviaciones puntuales en la disponibilidad de repuestos (Inventarios), atendidas caso a caso sin afectar la continuidad mayor."]]},{"t":"h2","n":"4.2","text":"Gestión de Compras y Proveedores"},{"t":"p","text":"Desempeño de proveedores externos e impacto en el sistema.","i":false},{"t":"table","rows":[["**Criterio de Evaluación**","**Detalle / Gestión**"],["**Universo de Proveedores Críticos**","**Total evaluados 2025:** 28 proveedores.\n**Calificación obtenida**: los 28 proveedores evaluados obtuvieron la calificación «Proveedor Permanece / Se mantiene»."],["**Promedio de Calificación**","94,57%"],["**Acciones Tomadas**","Con proveedores de bajo desempeño:\nDe acuerdo con los criterios de evaluación aplicados durante el proceso, ningún proveedor obtuvo calificaciones ubicadas en el rango de 0 - 79, por ello no se establecieron planes de mejora."],["**Impacto en el SGC**","¿Algún proveedor afectó la operación?\nNo se registraron"]]},{"t":"h2","n":"4.3","text":"Gestión Ambiental (ISO 14001)"},{"t":"p","text":"Referencia Normativa: ISO 14001 Numerales 9.3 (d) y (f).","i":false},{"t":"h3","text":"A. Desempeño de los Programas Ambientales (Num. 9.3 d):"},{"t":"table","rows":[["**Nombre del Programa Ambiental**","**Indicador / Unidad de Medida**","**Meta 2025**","**Resultado 2025**","**¿Cumple?**","**Análisis del Resultado**"],["PROGRAMA USO RACIONAL ENERGÍA ELÉCTRICA","Sensibilizaciones uso racional de energía eléctrica","100%","100%","Cumple","El resultado cumple la meta establecida, dado que se realizó la sensibilización sobre uso eficiente de la energía eléctrica y la divulgación del Programa de Uso Racional de Energía. Estas acciones permitieron dar cumplimiento a lo programado y fortalecer la gestión de la eficiencia energética en la organización."],["PROGRAMA DE GESTIÓN DE CALIDAD DEL AIRE","Cumplimiento de parámetros medidos calidad del aire","100%","100%","Cumple","Se realizaron los monitoreos de calidad del aire en los meses de marzo y septiembre, evaluando los parámetros de material particulado (PM10), dióxido de azufre (SO₂), dióxido de nitrógeno (NO₂) y monóxido de carbono (CO). Los resultados obtenidos evidencian que, para los tiempos de exposición analizados, las concentraciones registradas se encuentran por debajo de los límites máximos permisibles establecidos en la Resolución 2254 del 1 de noviembre de 2017, lo que indica cumplimiento normativo y ausencia de afectaciones a la calidad del aire en el área evaluada."],["PROGRAMA MANEJO DE RESIDUOS SÓLIDOS","Sensibilizaciones realizadas","100%","100%","Cumple","En cumplimiento del Programa de Manejo de Residuos Sólidos y del objetivo orientado a implementar campañas sobre el manejo adecuado de los residuos y las medidas para su reducción y/o aprovechamiento, durante la vigencia 2025 se ejecutaron las actividades de sensibilización programadas. Asimismo, se realizó una gestión adecuada de los residuos sólidos generados en campo, garantizando su correcta segregación, almacenamiento y disposición final conforme a los lineamientos internos y la normativa ambiental vigente, lo que evidencia el cumplimiento del programa y el fortalecimiento de la cultura ambiental en la operación."],["GESTIÓN DE HUELLA DE CARBONO","Gestión y Cumplimiento","100%","100%","Cumple","Es un programa formulado en octubre de 2025, cuyo objetivo principal es gestionar la huella de carbono generada por la compañía en la operación de sus activos, mediante la medición, seguimiento y reducción de las emisiones de Gases de Efecto Invernadero (GEI) a partir del año 2026. Las actividades contempladas incluyen la cuantificación de la huella de carbono, la implementación de acciones orientadas a la reducción de emisiones y el desarrollo de jornadas de capacitación sobre cambio climático y gestión de GEI."],["PROGRAMA DE EDUCACIÓN AMBIENTAL","Sensibilizaciones educación ambiental","100%","100%","Cumple","En el marco del Programa de Educación Ambiental, durante el período evaluado se ejecutaron las actividades de sensibilización y capacitación establecidas, dirigidas al personal propio vinculado al proyecto. Así mismo, se realizaron socializaciones de acuerdo con el calendario ambiental 2025. Estas acciones permitieron fortalecer la cultura ambiental, promover el cumplimiento normativo y prevenir posibles impactos asociados a la ejecución del proyecto."],["PROGRAMA SANEAMIENTO AMBIENTAL BÁSICO","Cumplimiento","100%","100%","Cumple","El Programa de Saneamiento Ambiental Básico se desarrolló mediante acciones de orden y aseo ambiental, manejo integral de residuos sólidos y separación en la fuente. Así mismo, se ejecutaron actividades de control de vectores garantizando condiciones adecuadas de orden, limpieza y salubridad en el proyecto."]]},{"t":"h3","text":"B. Comunicaciones de Partes Interesadas (Num. 9.3 f):"},{"t":"p","text":"Revisión de quejas, reclamos o solicitudes ambientales de la comunidad y autoridades.","i":false},{"t":"table","rows":[["**Tipo de Comunicación**","**Cantidad Recibida**","**Detalle / Respuesta Dada**"],["Quejas Ambientales","0","Durante el desarrollo operacional correspondiente al año 2025 no se registraron quejas de carácter ambiental por parte de la comunidad ni de autoridades competentes, lo que evidencia un adecuado desempeño ambiental y el cumplimiento de los lineamientos establecidos para la operación del proyecto."],["Requerimientos Legales","0","Durante el desarrollo operacional correspondiente al año 2025 no se generaron requerimientos ambientales adicionales a los contemplados en los instrumentos de manejo y permisos ambientales vigentes de las operadoras de los proyectos. No obstante, se dio cumplimiento a la ejecución de los monitoreos ambientales programados y a la elaboración de los Informes de Cumplimiento Ambiental (ICA), los cuales fueron debidamente radicados ante las autoridades ambientales competentes, conforme a los términos y plazos establecidos."],["Solicitudes Comunidad","8","Para PBI S.A.S. es fundamental garantizar la atención oportuna a través de los canales de comunicación y relacionamiento establecidos en el Plan de Comunicaciones de la compañía, en los territorios donde se desarrollan sus operaciones. En lo que respecta a la gestión de PQR, durante el año 2025 se recibieron ocho (8) solicitudes, las cuales fueron atendidas en un 100 %, mediante la emisión de comunicaciones formales de respuesta dirigidas a los respectivos peticionarios, dentro de los tiempos establecidos."]]},{"t":"h3","text":"C. Aspectos Ambientales, Tendencias y Objetivos (Num. 9.3 b y d):"},{"t":"table","rows":[["**Elemento**","**Información del periodo 2025**"],["**Cambios en aspectos ambientales significativos y obligaciones de cumplimiento**","[COMPLETAR: cambios en el periodo; referencia a la matriz de aspectos e impactos y a la matriz legal ambiental]"],["**Tendencias de desempeño ambiental 2024-2025**","[COMPLETAR: consumo de agua, energía, residuos y emisiones, con fuente y metas]"],["**Resultado frente a objetivos ambientales**","Programas ambientales cumplidos al 100% (4.3.A). [COMPLETAR: metas cuantitativas de los objetivos ambientales, si están definidas]"]]},{"t":"h2","n":"4.4","text":"Seguridad y Salud en el Trabajo (SST)"},{"t":"p","text":"~~Referencia Normativa: ISO 45001 (9.3) y Decreto 1072 (Art. 2.2.4.6.31).~~","i":true},{"t":"h3","text":"A. Estadísticas de Salud y Seguridad (Resultados Reactivos)"},{"t":"p","text":"~~(Cumplimiento Numerales 20, 21, 22 del Art. 2.2.4.6.31)~~","i":true},{"t":"table","rows":[["**Indicador**","**2024 (Base)**","**2025 (Actual)**","**Análisis de Causa / Tendencia**"],["**Accidentes de Trabajo (AT)**","1","**0**","**Tendencia Positiva.** Se cumplió la meta de cero accidentes."],["**Enfermedad Laboral (EL)**","0","**0**","Se mantiene en cero casos calificados."],["**Ausentismo (Total)**","106 días","**170 días**","**Tendencia Negativa.** Aumento asociado a incapacidades de origen común (no laboral)."],["**Daños a la Propiedad**","0","**0**","No se reportaron pérdidas materiales en los proyectos."]]},{"t":"h3","text":"B. Gestión de Condiciones de Salud y Trabajo (Prevención)"},{"t":"p","text":"~~(Cumplimiento Numerales 16, 17, 18, 24 del Art. 2.2.4.6.31)~~","i":true},{"t":"table","rows":[["**Gestión**","**Actividad / Indicador**","**Resultado / Conclusión**"],["**Inspecciones**","Programa de Inspecciones (Puestos, Máquinas)","**Ejecución Global: 99%.**\n• **Sinú 9 / EVECA:** 100% Cumplimiento. Sin hallazgos críticos.\n• **Buenavista:** 10 de 11 hallazgos cerrados (Pendiente locativo contenedor).\n• **La Paz:** 1 Hallazgo Abierto (Falta Lavaojos en zona de aceites).\n• **Corrales:** Hallazgos críticos por falta de dotación específica y certificación de alturas."],["**Vigilancia Ambiente**","Mediciones Higiénicas (Ruido, Iluminación)","• **Realizadas:** Sede Buenavista y Sinú 9.\n• **PENDIENTES:** Sedes Corrales, La Paz y EVECA no ejecutaron mediciones en 2025. Se requiere priorización presupuestal para 2026."],["**Vigilancia Salud**","Exámenes Médicos Ocupacionales","~~Cobertura:~~ **100%** del personal programado."],["**Rehabilitación**","Efectividad programas de rehabilitación","~~Casos:~~ **0** de origen laboral.\n~~Efectividad:~~ N/A."]]},{"t":"h3","text":"C. Gestión de Peligros, Participación y Emergencias"},{"t":"p","text":"~~(Cumplimiento Numerales 9, 10, 12, 19, 15, 21 del Art. 2.2.4.6.31)~~","i":true},{"t":"table","rows":[["**Elemento**","**Estado 2025**","**Detalle / Conclusión**"],["**Matriz de Peligros**","**Actualizada**","Se incorporó el riesgo biológico (Fiebre Amarilla) con prioridad Alta, a raíz del hallazgo de la auditoría del cliente en San Carlos (ver 5.3.A); no hubo otros cambios críticos en la valoración de riesgos por sede."],["**Reporte de Actos y Condiciones (Tarjetas)**","**28 Reportes**","**43% Cerrados**\n(12 Cerrados / 16 Abiertos)\n."],["**COPASST**","**Cumple**","~~Gestión:~~ **100%** Reuniones ejecutadas."],["**Emergencias**","**Ejecutado**","Se validó la capacidad de respuesta en las 5 sedes operativas, cubriendo los escenarios de mayor vulnerabilidad identificados en la matriz de amenazas:\n**Escenarios Críticos Evaluados:**\n• **Tecnológicos:** Incendio (Caldera, Forestal, Estructural), Derrames de Hidrocarburos y Explosiones.\n• **SST:** Rescate en Alturas (Torres/Tanques), Atención a Quemaduras (Deshidratadora - Corrales), Primeros Auxilios y Accidente Vial.\n• **Naturales:** Sismo (Participación en Simulacro Nacional).\n**Resultado:** Los ejercicios fueron evaluados como **EFICACES** en tiempos de respuesta y control. Se cerraron los planes de acción derivados en Buenavista y Sinú 9."],["**Desempeño SST Contratistas**","**Controlado**","~~Cumplimiento Requisitos SST:~~ **100%** verificado en ingreso.\n**Eficacia del Control de Acceso:** Se detectó un (1) incumplimiento grave a la Política de Alcohol y Drogas en el proyecto **La Paz** (Empresa ASETCO).\n**Acción:** Se aplicó protocolo de seguridad y restricción de acceso. El resto de contratistas cumplieron satisfactoriamente."]]},{"t":"h3","text":"D. Complementos de la Revisión (Art. 2.2.4.6.31)"},{"t":"p","text":"~~(Cumplimiento Numerales 2, 11, 15, 18, 19, 20, 21 y 23 del Art. 2.2.4.6.31 e indicadores de estructura, proceso y resultado)~~","i":true},{"t":"table","rows":[["**Punto / Tema**","**Información del periodo 2025**"],["**Num. 2: plan de trabajo anual SST**","Cumplimiento del plan de trabajo anual y su cronograma (% de ejecución): plan HSE estratégico 95%; Planta Buenavista 98%; Planta Corrales 98%; San Carlos 93%; Eveca 92%."],["**Num. 20: incidentes, accidentes y enfermedades**","Accidentes de trabajo: 0; enfermedad laboral: 0 (4.4.A). Incidentes sin lesión reportados e investigados: no se presentaron eventos."],["**Num. 21: ausentismo**","170 días en 2025 frente a 106 en 2024 (+60%), de origen común. Índice de ausentismo."],["**Num. 15 y 18: planes específicos y vigilancia de la salud**","Exámenes médicos ocupacionales: 100% del personal programado (4.4.B). Diagnóstico de condiciones de salud y programas de vigilancia epidemiológica: ajustados acorde a resultados."],["**Num. 11 y 19: identificación de peligros**","Se incorporó el riesgo biológico (Fiebre Amarilla) en la matriz IPVR con prioridad Alta (4.4.C y 5.3.A)."],["**Num. 23: deficiencias de la gestión SST**","Cierre de tarjetas de reporte en 43%; eficacia de cierre de acciones en 39,8% (Sinú 9); mediciones higiénicas pendientes en Corrales, La Paz y EVECA; hallazgos críticos en Corrales (dotación y certificación de alturas) y La Paz (lavaojos); aumento del ausentismo."],["**Indicadores de estructura, proceso y resultado (Art. 2.2.4.6.19 a 2.2.4.6.22)**","El acta presenta principalmente indicadores de resultado. Ver: https://datastudio.google.com/reporting/5caf92ea-0514-45de-b6d8-f426ee37e8e5"]]},{"t":"h2","n":"4.5","text":"Plan Estratégico de Seguridad Vial (PESV - Res. 40595)"},{"t":"p","text":"~~Referencia Normativa: Resolución 40595:2022 (Nivel Básico / Misionalidad 2).~~","i":true},{"t":"h3","text":"A. Seguimiento a Indicadores PESV (Paso 20):"},{"t":"p","text":"~~Evaluación del desempeño de la seguridad vial y cumplimiento de metas.~~","i":true},{"t":"table","rows":[["**Indicador Clave**","**Meta 2025**","**Resultado 2025**","**Estado**","**Análisis y Observaciones**"],["Tasa de siniestros viales (TSV)","0 siniestros","0","**CUMPLE**","No se presentaron siniestros viales en desplazamientos laborales."],["Riesgos de seguridad vial identificados (RSVI)","N/A","12","**N/A**","Doce riesgos viales identificados y controlados mediante la matriz de peligros y riesgos."],["Gestión de riesgos viales (GRV)","Gestionar el 100% de los riesgos viales","Sin riesgos de valoración alta","**CUMPLE**","No se identificaron riesgos viales de valoración alta."],["Cumplimiento de metas del PESV (CM PESV)","90%","100%","**CUMPLE**","Se lograron las 4 metas definidas en cada trimestre."],["Cumplimiento del plan anual de trabajo (CPlan PESV)","90%","98%","**CUMPLE**","48 de 49 actividades ejecutadas; una capacitación se reprogramó para el primer trimestre de 2026."],["Exceso de jornadas laborales de conductores (%EJLC)","0%","0%","**CUMPLE**","No se registraron excesos en la jornada diaria de los conductores."],["Inspecciones diarias preoperacionales (IDP)","100%","100%","**CUMPLE**","**Innovación**: Se implementó sistema digital mediante Google AppScript para el reporte diario de inspecciones y planificación de rutas en tiempo real."],["Cumplimiento del plan de mantenimiento preventivo (CPMVh)","100%","100%","**CUMPLE**","La flota (Modelos 2019 en adelante) se encuentra en condiciones óptimas. Se cumplió rigurosamente el plan de mantenimiento."],["Cumplimiento del plan de formación en seguridad vial (CuPF)","90%","85,7%","**NO CUMPLE**","6 de 7 capacitaciones ejecutadas; la restante se reprogramó para el primer trimestre de 2026."],["Cobertura del plan de formación (CoPF)","75%","[COMPLETAR]","**[COMPLETAR]**","[COMPLETAR: personas distintas capacitadas sobre el total de colaboradores]"],["No conformidades de auditoría cerradas (NCAC)","100%","0 NC","**CUMPLE**","La auditoría interna del PESV del 30/09/2025 no identificó no conformidades."]]},{"t":"h3","text":"B. Conclusión de la Gerencia sobre el PESV:"},{"t":"p","text":"La Gerencia verifica la eficacia del PESV, destacando la transformación digital del proceso mediante herramientas propias (AppScript) que permiten trazabilidad inmediata. El resultado de cero accidentes y el cumplimiento del 98% del plan anual de trabajo y del 86% del plan de formación (una capacitación reprogramada al primer trimestre de 2026) ratifican el compromiso con la seguridad vial.","i":false},{"t":"h3","text":"C. Clasificación y Cumplimiento de Pasos de la Resolución 40595 (Pasos 4, 9, 20, 22 y 24):"},{"t":"table","rows":[["**Requisito**","**Registro 2025**"],["**Nivel y tamaño (Misionalidad 2)**","Nivel básico: 11 a 49 vehículos o 2 a 49 conductores, contando vehículos de contratistas y de trabajadores puestos al servicio; si la organización cae en dos niveles, rige el más alto. Flota y conductores del periodo: 3 vehículos y 3 conductores. El PESV aplica por contratar o administrar personal de conductores (art. 12 de la Ley 1503 de 2011); por número de conductores (2 a 49) la organización se ubica en Nivel Básico, Misionalidad 2. En este nivel no aplican los pasos 2, 11, 13, 18, 19 y 21."],["**Paso 20: indicadores mínimos**","Se registran, miden y analizan los 11 indicadores mínimos aplicables al nivel básico, con corte a diciembre de 2025 (ver 4.5.A)."],["**Paso 20: reporte de autogestión**","Reporte anual de autogestión con corte al 31/12/2025, presentado ante el Ministerio del Trabajo el 30/05/2026 (plazo máximo establecido para el reporte de 2025 en la Circular 34 de 2026)."],["**Paso 9: plan anual de trabajo PESV**","98% de cumplimiento del plan anual de trabajo del PESV (48 de 49 actividades)."],["**Paso 22: auditoría anual**","Auditoría interna anual del PESV realizada el 30/09/2025, sin no conformidades."],["**Paso 24: comunicación y participación**","Comunicaciones de seguridad vial difundidas mediante el boletín mensual del SIG."],["**Paso 4: recursos del nivel directivo**","Los recursos del PESV 2026 hacen parte del presupuesto HSEQ aprobado (93.585.096 COP; ver 6.2)."]]},{"t":"h2","n":"4.6","text":"Desempeño y Retroalimentación de Grupos de Interés"},{"t":"p","text":"~~Seguimiento a las necesidades de los 8 grupos de interés validados en la caracterización (Ref. Documento V4-2024).~~","i":true},{"t":"table","rows":[["**Grupo de Interés**","**Mecanismo de Involucramiento**","**Retroalimentación y Gestión 2025**"],["**1. EMPLEADOS**","COPASST / Comité Convivencia / Encuestas","**Clima Estable.** Se atendieron solicitudes de bienestar y capacitación (100% Ejecución). ."],["**2. CLIENTES**","Encuestas / Reuniones Gerenciales","**Satisfacción Sobresaliente (4.3/5.0).** Se gestionaron requerimientos de mantenimiento predictivo (Infraes)."],["**3. PROVEEDORES**","Evaluaciones / Mesas de Trabajo","**Alineados.** Se fortalece la exigencia HSEQ con la nueva herramienta digital 2026."],["**4. COMUNIDAD / SOCIEDAD**","PQR / Socialización Proyectos","**Licencia Social Activa.** No se presentaron bloqueos ni reclamaciones ambientales en las zonas de operación."],["**5. ACCIONISTAS / INVERSIONISTAS**","Asambleas / Informes","**Respaldo.** Aprobación de recursos para continuidad del negocio y proyectos ESG."],["**6. ENTIDADES DEL ESTADO**","Reportes Legales / Auditorías","**Cumplimiento.** Reportes a MinTrabajo y ANLA entregados a tiempo. Matriz legal al 97,73%."],["**7. EMPRESAS PARES / ALIADOS**","Alianzas Estratégicas (Kronos/Omega)","**Sinergia.** Se ejecutó la actualización conjunta de la Materialidad 2025."],["**8. ENTIDADES FINANCIERAS**","Gestión de Tesorería","**Solidez.** Cumplimiento de obligaciones financieras que garantizan la operación."]]},{"t":"h2","n":"4.7","text":"CONSULTA Y PARTICIPACIÓN DE LOS TRABAJADORES"},{"t":"p","text":"Referencia: ISO 45001:2018 (Numerales 5.4 y 9.3.2.e)","i":false},{"t":"h3","text":"A. Mecanismos de Consulta y Participación"},{"t":"table","rows":[["**Mecanismo**","**Frecuencia**","**Cumplimiento 2025**","**Principales Aportes y Resultados**"],["**COPASST**","Mensual","100%","Se ejecutaron el 100% de las reuniones programadas. El comité participó activamente en la revisión de accidentes, inspecciones y validación de controles operacionales."],["**Comité de Convivencia Laboral**","Trimestral","100%","Se atendieron solicitudes de bienestar y se gestionó el clima laboral. No se reportaron casos de acoso laboral durante 2025."],["**Tarjetas de aporte (Actos/Condiciones)**","Permanente","28 Reportes","Los trabajadores reportaron 28 condiciones/actos inseguros. Se cerró el 43% (12/28).\n**Oportunidad:** Mejorar tiempo de respuesta y cierre."],["**Encuestas y Solicitudes**","Según necesidad","100% Atendidas","Se ejecutó el 100% de las solicitudes de capacitación y bienestar presentadas por los trabajadores."],["**Inspecciones SST**","Cronograma","99% Ejecución","Los trabajadores participaron activamente en inspecciones de seguridad con un cumplimiento global del 99%."],["**Simulacros de Emergencia**","Plan Emergencias","EFICAZ","Se validó la capacidad de respuesta en las 5 sedes operativas con participación activa del personal."]]},{"t":"h3","text":"B. Indicadores de Participación 2025"},{"t":"table","rows":[["Reuniones COPASST","Reportes Trabajadores","Cierre de Reportes","Inspecciones SST"],["12/12","28","43%","99%"],["(100% Cumplimiento)","(Tarjetas actos/condiciones)","(12 de 28 cerrados)","(Ejecución Global)"]]},{"t":"h3","text":"C. Principales Aportes de los Trabajadores en 2025"},{"t":"li","text":"**IDENTIFICACIÓN DE PELIGROS:** 28 reportes de condiciones y actos inseguros identificados por los trabajadores en campo, permitiendo acciones correctivas oportunas."},{"t":"li","text":"**MEJORA DE PROCEDIMIENTOS**: Aportes del COPASST implementados en la actualización de procedimientos de trabajo seguro y controles operacionales."},{"t":"li","text":"**CAPACITACIÓN:** Solicitudes de capacitación técnica atendidas al 100%, mejorando competencias del personal operativo."},{"t":"li","text":"**CULTURA DE PREVENCIÓN**: Participación activa en simulacros de emergencia validando la eficacia de los planes de respuesta en las 5 sedes."},{"t":"h3","text":"D. Acciones Implementadas por Consulta"},{"t":"table","rows":[["**Origen de la Consulta**","**Acción Implementada**","**Estado**"],["Solicitud COPASST","Mejoras en condiciones locativas y actualización de la matriz de peligros (riesgo biológico incorporado; ver 4.4.C).","IMPLEMENTADO"],["Reportes Trabajadores","Gestión de los 28 reportes recibidos: 12 cerrados (43%) y 16 abiertos; seguimiento mediante el sistema digital de tarjetas (ver 6.1).","EN PROCESO (43%)"],["Encuestas de Bienestar","Atención a solicitudes de bienestar y capacitación (100% ejecución).","EJECUTADO"],["Retroalimentación Simulacros","Mejoras en planes de emergencia y equipos de respuesta.","EN PROCESO"]]},{"t":"h3","text":"CONCLUSIÓN DE CONSULTA Y PARTICIPACIÓN 2025"},{"t":"p","text":"Los mecanismos de consulta y participación operan de manera EFICAZ. Se evidencia compromiso activo de los trabajadores en la identificación de peligros, reporte de condiciones inseguras y participación en comités legales (COPASST, Comité de Convivencia). Las sugerencias y reportes han generado mejoras tangibles en las condiciones de trabajo.","i":false},{"t":"p","text":"**Oportunidad de Mejora 2026:** Acelerar el tiempo de respuesta y cierre de tarjetas de reporte (actualmente 43% - meta: >80%). Se requiere fortalecer el seguimiento y comunicación de acciones tomadas a partir de los reportes de los trabajadores.","i":false},{"t":"h1","n":"5","text":"VERIFICACIÓN Y ASEGURAMIENTO"},{"t":"h2","n":"5.1","text":"Cumplimiento Legal y Normativo"},{"t":"p","text":"~~Evaluación de la matriz de requisitos legales (ISO 45001 9.1.2 / ISO 14001 9.1.2).~~","i":true},{"t":"table","rows":[["**Matriz Evaluada**","**Resultado 2024**","**Resultado 2025**","**Estado**","**Análisis de Brechas**"],["**Legal SST (Dec. 1072)**","96.38%","**97.73%**","**NO CUMPLE META**","Cumplimiento Alto. La brecha (2,27% frente a la meta del 100%) corresponde a la formalización administrativa del **Teletrabajo**, actualmente en gestión."],["**Legal Ambiental**","100%","**100%**","**CUMPLE**","Se evidencia total cumplimiento de obligaciones (Respel, Vertimientos, Licencias)."],["**Cambios Normativos**","N/A","**Evaluados**","**CUMPLE**","Se actualizaron matrices con las resoluciones 2025."]]},{"t":"h2","n":"5.2","text":"Resultados de Auditorías"},{"t":"p","text":"~~Referencia: ISO 9001 (9.3.2 c), ISO 14001 (9.3), ISO 45001 (9.3).~~","i":true},{"t":"table","rows":[["**Fuente de Auditoría**","**Tipo de Hallazgo**","**Cantidad**","**Estado Actual de las Acciones**"],["**Auditoría Interna HSEQ**","No Conformidades (NC)","**0**","N/A (Objetivo Cumplido)"],["","Oportunidades de Mejora","7","**En proceso de cierre (0% cerradas a la fecha de la revisión)**"],["**Auditoría Externa (Bureau Veritas)**","No Conformidades Mayores","**0**","N/A (Certificación Mantenida)"],["","Observaciones","**0**","N/A"],["**Auditoría NORSOK S-006**","Puntaje de Cumplimiento","**95.38%**","**Sobresaliente** (Sin NC Críticas)"],["**Estándares Mínimos (Res. 0312)**","Porcentaje Obtenido","**100%**","**Cumple Totalmente**"]]},{"t":"p","text":"**Conclusión sobre la eficacia del programa de auditorías:**","i":false},{"t":"p","text":"~~“El programa de auditorías se ejecutó según lo planeado y permitió identificar oportunidades críticas, asegurando el control y mejora del SIG.”~~","i":true},{"t":"h2","n":"5.3","text":"No Conformidades y Acciones Correctivas"},{"t":"h3","text":"A. Matriz Detallada de Hallazgos y Cierres"},{"t":"table","rows":[["**Fuente del Hallazgo**","**Sede / Operación**","**Tipo de Hallazgo**","**Cant.**","**Avance (Cierres)**","**Estado / Comentario**"],["**Auditoría CLIENTE**","San Carlos","**No Conformidad**","**1**","**100%**","**CERRADA. Riesgo biológico (Fiebre Amarilla) incluido en la matriz IPVR con prioridad Alta.**"],["**Auditoría INTERNA**","Administración","Oportunidad Mejora","7","**0%**","**Pendientes.** Hallazgos en Compras, Mantenimiento y HSEQ."],["**Inspecciones SST**","**Pta. Buenavista**","Hallazgos / Obs.","11","**91%**","**Excelente Gestión.** (10 de 11 cerradas)."],["**Inspecciones SST**","**Pta. Sinú 9**","Hallazgos / Obs.","10","**20%**","**Bajo Cierre.** Se requiere apoyo operativo para cerrar."],["**Simulacros**","**Pta. Sinú 9**","Oportunidad Mejora","12","**8%**","**Represado.** 11 acciones abiertas post-simulacro."],["**Simulacros**","Pta. Buenavista","Oportunidad Mejora","1","**100%**","Cerrada eficazmente."],["**Reporte Actos/Cond.**","Todas las Sedes","Tarjetas / Reportes","28","**43%**","12 cerradas y 16 abiertas (ver 4.4.C)."],["**Revisión Gerencial**","Administración","Compromisos","13","**30%**","Acciones estratégicas en curso (largo plazo)."]]},{"t":"h3","text":"B. Resumen General de Eficacia (2025):"},{"t":"table","rows":[["**Indicador**","**Resultado**","**Análisis**"],["**Total Acciones Gestionadas**","**83**","Volumen alto de hallazgos, evidencia un sistema activo."],["**Acciones Cerradas (Eficaces)**","**33**","**100% Eficacia Verificada** en los cierres realizados."],["**Acciones Abiertas / En Proceso**","**50**","El 60% de las acciones continúan abiertas."],["**% Eficacia de Gestión**","**39.8%**","**Desviación:** El nivel de cierre es bajo debido a la carga operativa en **Sinú 9**. Se establece como meta prioritaria el cierre de hallazgos vencidos para Marzo 2026."]]},{"t":"h1","n":"6","text":"SALIDAS DE LA REVISIÓN: DECISIONES Y MEJORA (ACT)"},{"t":"h2","n":"6.1","text":"Oportunidades de Mejora y Decisiones Estratégicas"},{"t":"p","text":"Se definen las siguientes estrategias para el fortalecimiento del SIG :","i":false},{"t":"table","rows":[["**Proceso Responsable**","**Decisión / Acción Estratégica**","**Justificación (Origen)**","**Recurso / Plazo**"],["HSEQ / COMPRAS","Evaluar e implementar la dotación específica para temporada invernal en Corrales, verificar la certificación de trabajo en alturas y asegurar la disponibilidad de equipos lavaojos en La Paz.","Sección 5.3","APROBADO - Primer Trimestre (Q1)"],["HSEQ","Ejecutar mediciones higiénicas en las sedes Corrales, La Paz y EVECA.","Sección 4.4","APROBADO FEBRERO-2026 - Primer Trimestre (Q1)"],["GESTIÓN HUMANA","Formalizar la implementación del esquema de teletrabajo.","Requisito Legal","APROBADO - Primer Trimestre (Q1)"],["HSEQ / OPERACIONES","Ejecutar un plan de cierre acelerado para priorizar la culminación de hallazgos vencidos en Sinú 9.","Baja eficacia en el cierre de hallazgos (39.8%)","META: MARZO-2026"],["GESTIÓN HUMANA / HSEQ","Relanzar el Programa de Generación Cultura HSEQ mediante un enfoque lúdico que fortalezca la participación del personal.","Baja participación en el plan anual de capacitaciones.","APROBADO - Primer Trimestre (Q1)"],["HSEQ / TIC","Implementar un sistema de seguimiento en línea para acciones de mejora.","Fortalecer la trazabilidad y seguimiento de acciones derivadas del SIG.","APROBADO - Segundo Trimestre (Q2)"],["HSEQ","Fortalecer la socialización del portal del SIG disponible en Google Sites.","Baja consulta y apropiación de la documentación del SIG.","APROBADO - Segundo Trimestre (Q2)"],["HSEQ","Realizar seguimiento al sistema digital de tarjetas de aporte.","Fortalecer la participación y cierre oportuno de reportes generados por los trabajadores.","APROBADO - Segundo Trimestre (Q2)"]]},{"t":"h2","n":"6.2","text":"Asignación de Recursos y Cambios al SIG"},{"t":"p","text":"~~Decisiones de la Alta Dirección sobre la provisión de recursos para el siguiente periodo.~~","i":true},{"t":"h3","text":"A. Asignación de Recursos 2026"},{"t":"table","rows":[["**Tipo de Recurso**","**Descripción de la Necesidad / Cambio Requerido**","**Decisión / Aprobación**"],["**Infraestructura y Tecnología**","Renovación de equipos de cómputo y software obsoleto.","Pendiente"],["**Talento Humano y Formación**","• Asignación Presupuestal para saldar los pendientes de años anteriores en temas de bienestar\n• Asignación de recursos para el presente año con el fin de ejecutar temas de capacitación de cumplimiento legal y normativo y ejecución del Programa de Bienestar.\n• Fortalecimiento de la cultura organizacional por medio de talleres en los que se involucre al 100% de los colaboradores\n• Software de Gestión del Desempeño que involucre competencias e indicadores","[COMPLETAR: la Gerencia define Aprobado o Pendiente]"],["**Presupuesto HSEQ 2026**","**Mantenimiento del presupuesto 2025** (Ajuste solo por IPC). Se regula el CAPEX (Inversiones nuevas) no urgentes.\n**Total estimado :** 93.585.096 COP\nPriorizando uso de recursos ARL y formadores internos","Aprobado"],["**Otros Recursos**","**1. Salud Laboral:** Exámenes Médicos Ocupacionales (Ingreso, Periódicos, Retiro)\n**2. Psicosocial:** Aplicación de Batería de Riesgo Psicosocial (Experto Externo).","Aprobado"]]},{"t":"h3","text":"B. Cambios al SIG, Política, Objetivos y Alineación Estratégica (ISO 9.3.1 y 9.3.3; Dec. 1072 num. 5)"},{"t":"table","rows":[["**Elemento**","**Detalle**"],["**Cambios al SIG identificados en la revisión**","(a) Automatización interna con AppScript y Google en reemplazo de ISOLUCION (gestión del cambio, sección 2); (b) incorporación del proceso financiero al SIG (en proceso); (c) sistema de seguimiento en línea de acciones de mejora (6.1); (d) programa de gestión de huella de carbono, formulado en octubre de 2025 con implementación en 2026 (4.3); (e) formalización del teletrabajo (6.1)."],["**Revisión de política y objetivos (SIG y SST)**","[COMPLETAR: la Gerencia confirma si la política y los objetivos y metas 2026 se mantienen o se ajustan; adjuntar objetivos 2026]"],["**Alineación con la dirección estratégica**","Propuesta: el SIG está alineado con la estrategia de transformación digital y con los objetivos del SIG. [COMPLETAR: confirmación de la Gerencia]"],["**Integración con otros procesos del negocio**","Incorporación del proceso financiero al SIG y uso de tableros de control y automatización (AppScript) que integran HSEQ con TIC."],["**Implicaciones para la dirección estratégica**","Transición energética y ESG, descarbonización, ciberseguridad y cumplimiento (materialidad, 3.2); riesgo físico por eventos extremos y riesgo de transición regulatoria por cambio climático (3.1)."],["**Debilidad de la DOFA sin acción asociada**","Dependencia operativa de pozos maduros sin plan de continuidad de negocio (BCP) documentado (3.1). [COMPLETAR: decisión y plazo de la Gerencia]"]]},{"t":"h2","n":"6.3","text":"Conclusión de la Gerencia"},{"t":"p","text":"La Gerencia General concluye que el Sistema Integrado de Gestión de **PETROLEUM BLENDING INTERNATIONAL SAS ESP**:","i":false},{"t":"li","text":"Es **Conveniente** (Se ajusta a la cultura y estrategia)."},{"t":"li","text":"Es **Adecuado** (Cumple con los requisitos legales y normativos)."},{"t":"li","text":"Es **Eficaz** (Logra los resultados planificados)."},{"t":"h2","n":"6.4","text":"Divulgación de los Resultados de la Revisión"},{"t":"p","text":"~~Referencia: Dec. 1072 (Art. 2.2.4.6.31, parágrafo), ISO 45001 (9.3).~~","i":true},{"t":"table","rows":[["**Destinatario**","**Medio, fecha y evidencia**"],["**COPASST**","[COMPLETAR: fecha y n.º de acta de la reunión en la que se socializó]"],["**Responsable del SG-SST**","[COMPLETAR: nombre y fecha de entrega para definir las acciones preventivas, correctivas y de mejora]"],["**Trabajadores y sus representantes**","[COMPLETAR: medio y fecha de comunicación de las salidas de la revisión]"]]},{"t":"sign"},{"t":"table","rows":[["**GERENTE GENERAL**\nRepresentante Legal","**DIRECTOR HSEQ**\nResponsable del SIG"]]},{"t":"table","rows":[["**Elaboró:**\nÁREA: DIR HSQ\nFECHA: 26/01/2026","**Aprobó:**\nÁREA: GERENCIA GENERAL\nFECHA: 26/01/2026"]]}]}</script>

<script>
/* ===================== Utilidades ===================== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const plain = s => String(s).replace(/\*\*|~~/g, '');
function inline(mk) {
    return esc(mk)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/~~(.+?)~~/g, '<em>$1</em>')
        .replace(/\[((?:COMPLETAR|VERIFICAR)[^\]]*)\]/g, '<span class="pend">$1</span>')
        .replace(/\n/g, '<br>');
}
const SMALL = new Set(['de', 'la', 'del', 'y', 'a', 'el', 'en', 'los', 'las', 'al', 'o', 'e']);
function titleCase(s) {
    return s.toLowerCase().split(' ').map((w, i) => (i > 0 && SMALL.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
const OK = /^(CUMPLE|CUMPLE TOTALMENTE|EJECUTADO.*|CERRAD[OA]S?|APROBAD[OA].*|IMPLEMENTAD[OA]|EFICAZ|SOBRESALIENTE|S[ÍI]|VIGENTE|ACTUALIZAD[OA]|GESTIONADO|CONTROLADO|CUMPLIDO|OPERATIVO|ACTIVO|EXCELENTE)$/;
const WARN = /^(EN PROCESO.*|PENDIENTE.*|PARCIAL|CUMPLE PARCIALMENTE|EN EVALUACI[ÓO]N|META:.*|EN EJECUCI[ÓO]N|PROGRAMAD[OA]|REPROGRAMAD[OA])$/;
const ERR = /^(NO CUMPLE.*|NO INICIADO|CR[ÍI]TICO|VENCID[OA]|ABIERT[OA]S?)$/;
function tagClass(p) {
    const t = p.trim().toUpperCase().replace(/[.\s]+$/, '');
    if (OK.test(t)) return 'tag-ok';
    if (ERR.test(t)) return 'tag-err';
    if (WARN.test(t)) return 'tag-warn';
    return '';
}
function cell(c) {
    const p = plain(c).trim();
    const cls = tagClass(p);
    if (cls && p.length <= 60 && p.indexOf('\n') < 0) return '<span class="tag ' + cls + '">' + esc(p) + '</span>';
    return inline(c);
}

/* ===================== Tablas ===================== */
function isKV(rows) {
    if (rows.length < 2) return false;
    const n = rows.filter(r => /:\s*$/.test(plain(r[0]).trim())).length;
    return n / rows.length >= 0.5;
}
function renderKV(rows) {
    let h = '<div class="kv-grid">';
    rows.forEach(r => {
        for (let j = 0; j < r.length; j += 2) {
            const lab = plain(r[j]).replace(/\s*:\s*$/, '');
            const val = (j + 1 < r.length) ? r[j + 1] : '';
            const wide = r.length <= 2 ? ' wide' : '';
            h += '<div class="kv' + wide + '"><span class="k">' + esc(lab) + '</span>' + inline(val) + '</div>';
        }
    });
    return h + '</div>';
}
function isStrip(rows) {
    if (rows.length < 2 || rows.length > 3 || rows[0].length < 3) return false;
    return rows.every(r => r.every(c => plain(c).length <= 45));
}
function stripCards(rows) {
    let h = '<div class="kpi-row">';
    rows[0].forEach((lab, i) => {
        h += '<div class="kpi-card"><div class="kpi-lab">' + inline(plain(lab)) + '</div><div class="kpi-val">' +
            inline(plain(rows[1][i] || '')) + '</div>' +
            (rows[2] ? '<div class="kpi-sub">' + inline(plain(rows[2][i] || '')) + '</div>' : '') + '</div>';
    });
    return h + '</div>';
}
function metricCards(rows) {
    const hd = rows[0].map(h => plain(h).trim());
    if (!/^indicador( clave)?$/i.test(hd[0]) || rows.length - 1 > 8) return '';
    let vi = hd.findIndex(h => /resultado 2025|2025 \(actual\)/i.test(h));
    if (vi < 0) vi = hd.findIndex(h => /^resultado/i.test(h));
    if (vi < 0) return '';
    const ti = hd.findIndex(h => /^estado/i.test(h));
    let h = '<div class="kpi-row">';
    rows.slice(1).forEach(r => {
        let v = plain(r[vi] || '').split(' (')[0].trim();
        if (v.length > 24) v = v.slice(0, 22) + '…';
        const tg = ti >= 0 ? plain(r[ti] || '').trim() : '';
        const cls = tg ? tagClass(tg) : '';
        h += '<div class="kpi-card"><div class="kpi-lab">' + esc(plain(r[0]).replace(/\s*\(.*$/, '')) + '</div><div class="kpi-val">' + esc(v) + '</div>' +
            (cls ? '<div class="kpi-sub"><span class="tag ' + cls + '">' + esc(tg) + '</span></div>' : '') + '</div>';
    });
    return h + '</div>';
}
function renderTable(rows) {
    if (isKV(rows)) return renderKV(rows);
    if (isStrip(rows)) return stripCards(rows);
    let out = metricCards(rows);
    out += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        rows[0].map(h => '<th>' + inline(plain(h)) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.slice(1).map(r => '<tr>' + r.map(c => '<td>' + cell(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>';
    return out;
}

/* ===================== Bloques ===================== */
const RISK_RE = /Bajo\s+(\d+)[^\d]+Moderado\s+(\d+)[^\d]+Alto\s+(\d+)[^\d]+Extremo\s+(\d+)/i;
function renderItems(items) {
    let html = '', list = [], chart = null;
    const flush = () => {
        if (!list.length) return;
        html += '<ul class="ul-clean">' + list.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>';
        list = [];
        if (chart) {
            html += '<div class="chart-box"><canvas class="risk-chart" data-v="' + chart.join(',') + '"></canvas></div>';
            chart = null;
        }
    };
    items.forEach(b => {
        if (b.t === 'li') {
            list.push(b.text);
            const m = RISK_RE.exec(plain(b.text));
            if (m) chart = [m[1], m[2], m[3], m[4]];
            return;
        }
        flush();
        if (b.t === 'p') {
            const cls = 'para' + ((b.i || /^Referencia/i.test(plain(b.text))) ? ' ref' : '');
            html += '<p class="' + cls + '">' + inline(b.text) + '</p>';
        } else if (b.t === 'h3') {
            html += '<div class="lbl">' + esc(b.text) + '</div>';
        } else if (b.t === 'table') {
            html += renderTable(b.rows);
        }
    });
    flush();
    return html;
}

/* ===================== Modelo -> secciones ===================== */
function build(model) {
    const sections = [];
    let sec = null, sub = null;
    const bl = model.blocks;
    for (let i = 0; i < bl.length; i++) {
        const b = bl[i];
        if (b.t === 'h1') { sec = { n: b.n, title: b.text, intro: [], subs: [] }; sections.push(sec); sub = null; continue; }
        if (!sec) continue;
        if (b.t === 'sign') {
            const t = [];
            for (let k = i + 1; k <= i + 2 && k < bl.length; k++) if (bl[k].t === 'table') t.push(bl[k]);
            sec.sign = t; i += t.length; sub = null; continue;
        }
        if (b.t === 'h2') { sub = { n: b.n, title: b.text, items: [] }; sec.subs.push(sub); continue; }
        (sub ? sub.items : sec.intro).push(b);
    }
    return sections;
}
function renderSign(tables) {
    if (!tables || !tables.length) return '';
    let h = '<div class="signature-box">';
    (tables[0].rows[0] || []).forEach(c => {
        const parts = c.split('\n');
        h += '<div class="sign-line">' + inline(plain(parts[0])) + (parts[1] ? '<span>' + inline(plain(parts.slice(1).join(' '))) + '</span>' : '') + '</div>';
    });
    h += '</div>';
    if (tables[1]) {
        h += '<div class="sign-meta">' + (tables[1].rows[0] || []).map(c => '<div>' + inline(plain(c)) + '</div>').join('') + '</div>';
    }
    return h;
}
function renderSection(s, i) {
    let h = '<div id="sec' + i + '" class="section-view"><div class="stack">';
    h += '<div class="card"><div class="card-title">' + esc(s.n + '. ' + s.title) + '</div>' + renderItems(s.intro) + '</div>';
    s.subs.forEach(sub => {
        h += '<div class="card"><div class="card-title">' + esc(sub.n + ' ' + sub.title) + '</div>' + renderItems(sub.items) + '</div>';
    });
    if (s.sign) h += '<div class="card">' + renderSign(s.sign) + '</div>';
    return h + '</div></div>';
}

/* ===================== Render principal ===================== */
let current = 0;
function navigate(i) {
    current = i;
    document.querySelectorAll('.section-view').forEach((e, k) => e.classList.toggle('active', k === i));
    document.querySelectorAll('.nav-item').forEach((e, k) => e.classList.toggle('active', k === i));
    document.getElementById('main').scrollTo({ top: 0 });
    history.replaceState(null, '', '#s' + (i + 1));
}
function periodo(sections) {
    if (!sections.length) return '';
    for (const b of sections[0].intro) {
        if (b.t !== 'table') continue;
        for (const r of b.rows) for (let j = 0; j + 1 < r.length; j++)
            if (/^periodo/i.test(plain(r[j]).trim())) return plain(r[j + 1]).trim();
    }
    return '';
}
function render(model, origen) {
    const sections = build(model);
    const m = model.meta || {};
    document.getElementById('nav').innerHTML = sections.map((s, i) =>
        '<div class="nav-item" data-i="' + i + '"><div class="nav-icon">' + esc(s.n) + '</div>' +
        esc(titleCase(s.title.split(':')[0].replace(/\s*\(.*$/, ''))) + '</div>').join('');
    document.querySelectorAll('.nav-item').forEach(e => e.addEventListener('click', () => navigate(+e.dataset.i)));
    document.getElementById('views').innerHTML = sections.map(renderSection).join('');
    const per = periodo(sections);
    document.getElementById('subtitle').textContent = per ? 'Evaluación del Periodo: ' + per : '';
    document.getElementById('statusPill').innerHTML = '<i class="fa-solid fa-check"></i> VERSIÓN ' + esc(m.version || '') + ' · ' + esc(m.date || '');
    document.getElementById('footerInfo').innerHTML = 'Código: ' + esc(m.code || '') + '<br>Versión: ' + esc(m.version || '') +
        '<br>Fecha: ' + esc(m.date || '') + '<br><span style="opacity:.7">' + esc(origen) + '</span>' +
        '<div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">' +
        '<strong style="color:var(--accent);">Proyectó:</strong><br>' + CONFIG.AUTHOR + '</div>';
    document.title = 'Acta Revisión Gerencial SIG' + (per ? ' ' + per : '') + ' | PBI SAS ESP';
    // gráficos (solo si Chart.js cargó)
    if (typeof Chart !== 'undefined') {
        document.querySelectorAll('.risk-chart').forEach(cv => {
            const v = cv.dataset.v.split(',').map(Number);
            new Chart(cv, {
                type: 'doughnut',
                data: { labels: ['Bajo', 'Moderado', 'Alto', 'Extremo'], datasets: [{ data: v, backgroundColor: ['#10b981', '#f59e0b', '#f97316', '#ef4444'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        });
    }
    const h = parseInt((location.hash || '').replace('#s', ''), 10);
    navigate(Math.min(Math.max((h || current + 1) - 1, 0), Math.max(sections.length - 1, 0)));
}
function banner(msg) {
    document.getElementById('banner').innerHTML = msg ? '<div class="note-box">' + esc(msg) + '</div>' : '';
}
async function load() {
    let model = null, origen = 'Datos: copia guardada';
    if (CONFIG.DATA_URL) {
        try {
            const sep = CONFIG.DATA_URL.indexOf('?') >= 0 ? '&' : '?';
            const url = CONFIG.DATA_URL + sep + (CONFIG.TOKEN ? 't=' + encodeURIComponent(CONFIG.TOKEN) + '&' : '') + '_=' + Date.now();
            const r = await fetch(url, { cache: 'no-store' });
            const j = await r.json();
            if (!j || !j.blocks) throw new Error(j && j.error ? j.error : 'respuesta sin datos');
            model = j;
            origen = 'Datos en vivo · ' + new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
            banner('');
        } catch (e) {
            console.warn('No se pudo leer el acta en vivo:', e);
            banner('No se pudo leer el acta en vivo; se muestra la última copia guardada.');
        }
    }
    if (!model) model = JSON.parse(document.getElementById('acta-data').textContent);
    render(model, origen);
}
(function init() {
    if (CONFIG.LOGO_URL) document.getElementById('companyLogo').src = CONFIG.LOGO_URL;
    if (CONFIG.PDF_URL) { const a = document.getElementById('pdfLink'); a.href = CONFIG.PDF_URL; a.style.display = ''; }
    load();
    if (CONFIG.REFRESH_MINUTES > 0) setInterval(load, CONFIG.REFRESH_MINUTES * 60000);
})();
</script>
